name: Deploy Gaius GitHub Pages
run-name: Deploy Gaius Pages [${{ inputs.release_token || github.sha }}]

# Pages publishes exactly one file: the Minecraft 26.2 browser client
# (Gaius-26.2.html). Minecraft 1.21.11 is permanently retired from Pages.
# Push runs and dispatches without release_tag follow the repository's Latest
# release; release_tag pins a specific tag (for example a pre-release).

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - relay-nodes.json
      - .github/workflows/pages.yml
  workflow_dispatch:
    inputs:
      release_token:
        description: Unique token binding a release publish to this Pages run
        required: true
        type: string
      release_tag:
        description: Release tag whose Gaius-26.2.html should be deployed (empty = the repository's Latest release)
        required: false
        default: ''
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out Pages source
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Resolve release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${REQUESTED_RELEASE_TAG}" ]; then
            tag="${REQUESTED_RELEASE_TAG}"
            source='release_tag input'
          else
            # Without a tag argument gh resolves releases/latest: the release
            # marked Latest (never a draft or pre-release).
            tag="$(gh release view --repo "${GITHUB_REPOSITORY}" --json tagName --jq .tagName)"
            source='Latest release'
          fi
          if [[ ! "$tag" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]*$ ]]; then
            echo "::error::Refusing unexpected release tag: '${tag}'"
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Deploying Gaius-26.2.html from ${tag} (${source})" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Download the Minecraft 26.2 client
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf pages-publish
          mkdir -p pages-publish
          gh release download "$PAGES_RELEASE_TAG" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern 'Gaius-26.2.html' \
            --dir pages-publish \
            --clobber
          # The published site is exactly one file; 1.21.11 must not reappear.
          test "$(find pages-publish -mindepth 1 | wc -l)" -eq 1
          test -f pages-publish/Gaius-26.2.html
          test -s pages-publish/Gaius-26.2.html
          test ! -e pages-publish/Gaius-1.21.11.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-publish
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
