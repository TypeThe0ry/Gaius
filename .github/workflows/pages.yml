name: Deploy Gaius GitHub Pages
run-name: Deploy Gaius Pages [${{ inputs.release_token || github.sha }}]

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - relay-nodes.json
      - .github/workflows/pages.yml
  workflow_dispatch:
    inputs:
      release_token:
        description: Unique token binding a release publish to this Pages run
        required: true
        type: string
      release_tag:
        description: Release tag whose browser assets should be deployed
        required: false
        default: v0.1.0
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out Pages source
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Download the two version files
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_RELEASE_TAG: ${{ inputs.release_tag || 'v0.1.0' }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf pages-publish
          mkdir -p pages-publish
          gh release download "$PAGES_RELEASE_TAG" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern 'Gaius-1.21.11.html' \
            --pattern 'Gaius-26.2.html' \
            --dir pages-publish \
            --clobber
          test "$(find pages-publish -maxdepth 1 -type f | wc -l)" -eq 2
          test -f pages-publish/Gaius-1.21.11.html
          test -f pages-publish/Gaius-26.2.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-publish
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
