name: Deploy Gaius GitHub Pages
run-name: Deploy Gaius Pages [${{ inputs.release_token || github.sha }}]

on:
  workflow_dispatch:
    inputs:
      release_token:
        description: Unique token binding a release publish to this Pages run
        required: true
        type: string
      release_tag:
        description: Release tag to deploy (empty selects Latest)
        required: false
        default: ''
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out packaging tools and profile metadata only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            port/scripts
            port/versions
          persist-credentials: false
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Resolve release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$REQUESTED_RELEASE_TAG"
          if [ -z "$tag" ]; then
            tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          fi
          [[ "$tag" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]*$ ]] || exit 1
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Download and verify the profile-driven release matrix
        id: download
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_RELEASE_TAG: ${{ steps.release.outputs.tag }}
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        shell: bash
        run: |
          set -euo pipefail
          assets="$RUNNER_TEMP/pages-release-assets"
          previous="$RUNNER_TEMP/pages-previous-assets"
          mkdir -p "$assets" "$previous"
          gh release view "$PAGES_RELEASE_TAG" --repo "$GITHUB_REPOSITORY"             --json assets --jq '.assets[].name' > "$assets/names.txt"
          for profile in 1.21.11 26.2 26.3; do
            grep -Fxq "Gaius-site-${profile}.tar.gz" "$assets/names.txt" || {
              echo "Missing multi-profile site archive for ${profile}" >&2
              exit 1
            }
          done
          grep -Fxq Gaius-pages-matrix.json "$assets/names.txt" || {
            echo "Missing Gaius-pages-matrix.json" >&2
            exit 1
          }
          gh release download "$PAGES_RELEASE_TAG" --repo "$GITHUB_REPOSITORY"             --pattern SHA256SUMS --dir "$assets"
          if grep -Fxq Gaius-pages-matrix.json "$assets/names.txt"; then
            gh release download "$PAGES_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern Gaius-pages-matrix.json --dir "$assets"
          fi
          if grep -Eq '^Gaius-site-.*[.]tar[.]gz$' "$assets/names.txt"; then
            gh release download "$PAGES_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern 'Gaius-site-*.tar.gz' --dir "$assets"
          else
            gh release download "$PAGES_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern 'Gaius-*.html' --dir "$assets"
          fi
          previous_tag=""
          if [ -n "$PAGES_BASE_URL" ]; then
            previous_tag="$(curl -fsSL --max-time 20 "${PAGES_BASE_URL%/}/gaius-pages.json" \
              | jq -r 'select(.layout == "site") | .tag // empty' || true)"
          fi
          previous_args=()
          if [[ "$previous_tag" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]*$ ]] && [ "$previous_tag" != "$PAGES_RELEASE_TAG" ]; then
            if gh release download "$previous_tag" --repo "$GITHUB_REPOSITORY" \
              --pattern SHA256SUMS --pattern 'Gaius-site-*.tar.gz' --dir "$previous"; then
              previous_args=(--previous-release "$previous")
            else
              echo "::warning::The previous site generation could not be downloaded; retention is unavailable"
            fi
          fi
          python3 port/scripts/build-pages-site.py --publish-release "$assets" pages-publish \
            --tag "$PAGES_RELEASE_TAG" "${previous_args[@]}" --json "$RUNNER_TEMP/pages-publish-size.json"
          python3 - "$RUNNER_TEMP/pages-publish-size.json" <<'PYTHON'
          import json, os, sys
          report = json.load(open(sys.argv[1], encoding="utf-8"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("layout=" + report["layout"] + "\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("Verified release: " + os.environ["PAGES_RELEASE_TAG"] + "\n")
              summary.write("Pages total including retained files: " + str(report["totalBytes"]) + " / " + str(report["limitBytes"]) + " bytes\n")
              for profile, sizes in report["profiles"].items():
                  summary.write("- " + profile + ": " + json.dumps(sizes, sort_keys=True) + " bytes\n")
              for profile, size in report["retainedBytes"].items():
                  summary.write("- Retained " + profile + ": " + str(size) + " bytes\n")
              for asset, digest in report["checksums"].items():
                  summary.write("- " + asset + " SHA256: " + digest + "\n")
              for warning in report["warnings"]:
                  summary.write("- Warning: " + warning + "\n")
          PYTHON
          # Re-run the public command-line gate against the exact assembled tree
          # and matrix manifest. This keeps the 900 MB policy visible in CI.
          python3 port/scripts/build-pages-site.py --check-total pages-publish \
            --extra-file "$assets/Gaius-pages-matrix.json" \
            --json "$RUNNER_TEMP/pages-check-total.json"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-publish
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
