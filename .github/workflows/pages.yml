name: Deploy Gaius GitHub Pages
run-name: Deploy Gaius Pages [${{ inputs.release_token || github.sha }}]

# Pages publishes the Minecraft 1.21.11, 26.2 and 26.3 browser clients of one
# release. Releases from v0.4.0 on carry a multi-file site per profile
# (Gaius-site-1.21.11.tar.gz, Gaius-site-26.2.tar.gz, Gaius-site-26.3.tar.gz,
# built by port/scripts/build-pages-site.py): content-hashed assets that the
# site's Service Worker caches immutably, the singleplayer server loaded only
# when a world opens, and sounds streamed after the client starts. Each archive
# is extracted to <profile>/, and Gaius-<profile>.html at the root becomes a
# redirect to it so existing links keep working. The content-hashed files of
# the site release deployed before (named by the live gaius-pages.json and
# verified against that release's own SHA256SUMS) stay published next to the
# new ones, so a tab opened before the deploy can still load its lazy assets.
# Older releases (no site archives) still publish the three single-file clients
# (Gaius-1.21.11.html, Gaius-26.2.html and Gaius-26.3.html), plus a
# <profile>/gaius-sw.js that unregisters the Service Worker of an earlier site
# deploy and a <profile>/index.html that redirects to the single file; the
# portable single files remain release downloads either way.
#
# Nothing in the repository checkout is published, so the workflow runs only on
# dispatch. Without release_tag it follows the repository's Latest release;
# release_tag pins a specific tag (for example a pre-release). Every deployed
# file must come from an asset whose bytes match that release's SHA256SUMS;
# releases without one fail closed.

on:
  workflow_dispatch:
    inputs:
      release_token:
        description: Unique token binding a release publish to this Pages run
        required: true
        type: string
      release_tag:
        description: Release tag whose Gaius clients should be deployed (empty = the repository's Latest release)
        required: false
        default: ''
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # No checkout: nothing from the repository is published, and every step
      # below reads only release assets (gh release download --repo).
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Resolve release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${REQUESTED_RELEASE_TAG}" ]; then
            tag="${REQUESTED_RELEASE_TAG}"
            source='release_tag input'
          else
            # Without a tag argument gh resolves releases/latest: the release
            # marked Latest (never a draft or pre-release).
            tag="$(gh release view --repo "${GITHUB_REPOSITORY}" --json tagName --jq .tagName)"
            source='Latest release'
          fi
          if [[ ! "$tag" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]*$ ]]; then
            # Never echo the raw value: it could smuggle workflow commands.
            echo "::error::Refusing unexpected release tag from ${source}"
            printf 'Rejected release tag (shell-escaped): %q\n' "$tag"
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "source=${source}" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag ${tag} (${source}); not yet verified"
      - name: Download and verify the Minecraft 1.21.11, 26.2 and 26.3 clients
        id: download
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_RELEASE_TAG: ${{ steps.release.outputs.tag }}
          PAGES_RELEASE_SOURCE: ${{ steps.release.outputs.source }}
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf pages-publish
          mkdir -p pages-publish
          # Bind the deployed bytes to the release. SHA256SUMS stays outside the
          # publish directory; gh fails when the release has no SHA256SUMS asset.
          sums_dir="${RUNNER_TEMP}/pages-release-sums"
          rm -rf "$sums_dir"
          mkdir -p "$sums_dir"
          gh release download "$PAGES_RELEASE_TAG" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern 'SHA256SUMS' \
            --dir "$sums_dir" \
            --clobber
          test -s "$sums_dir/SHA256SUMS"
          site_assets="$(gh release view "$PAGES_RELEASE_TAG" --repo "${GITHUB_REPOSITORY}" \
            --json assets --jq '[.assets[].name | select(. == "Gaius-site-1.21.11.tar.gz" or . == "Gaius-site-26.2.tar.gz" or . == "Gaius-site-26.3.tar.gz")] | length')"
          summary=()
          if [ "$site_assets" -eq 3 ]; then
            layout=site
            # Multi-file layout: one verified archive per profile, extracted to <profile>/.
            sites_dir="${RUNNER_TEMP}/pages-release-sites"
            rm -rf "$sites_dir"
            mkdir -p "$sites_dir"
            gh release download "$PAGES_RELEASE_TAG" \
              --repo "${GITHUB_REPOSITORY}" \
              --pattern 'Gaius-site-1.21.11.tar.gz' \
              --pattern 'Gaius-site-26.2.tar.gz' \
              --pattern 'Gaius-site-26.3.tar.gz' \
              --dir "$sites_dir" \
              --clobber
            test "$(find "$sites_dir" -mindepth 1 | wc -l)" -eq 3
            # Exactly one record per archive, and every archive must verify before it is unpacked.
            grep -E '^[0-9a-f]{64}  Gaius-site-1\.21\.11\.tar\.gz$' "$sums_dir/SHA256SUMS" > "$sums_dir/Gaius-site-1.21.11.tar.gz.sha256" || true
            if [ "$(wc -l < "$sums_dir/Gaius-site-1.21.11.tar.gz.sha256")" -ne 1 ]; then
              echo "::error::SHA256SUMS of ${PAGES_RELEASE_TAG} must hold exactly one Gaius-site-1.21.11.tar.gz record"
              exit 1
            fi
            grep -E '^[0-9a-f]{64}  Gaius-site-26\.2\.tar\.gz$' "$sums_dir/SHA256SUMS" > "$sums_dir/Gaius-site-26.2.tar.gz.sha256" || true
            if [ "$(wc -l < "$sums_dir/Gaius-site-26.2.tar.gz.sha256")" -ne 1 ]; then
              echo "::error::SHA256SUMS of ${PAGES_RELEASE_TAG} must hold exactly one Gaius-site-26.2.tar.gz record"
              exit 1
            fi
            grep -E '^[0-9a-f]{64}  Gaius-site-26\.3\.tar\.gz$' "$sums_dir/SHA256SUMS" > "$sums_dir/Gaius-site-26.3.tar.gz.sha256" || true
            if [ "$(wc -l < "$sums_dir/Gaius-site-26.3.tar.gz.sha256")" -ne 1 ]; then
              echo "::error::SHA256SUMS of ${PAGES_RELEASE_TAG} must hold exactly one Gaius-site-26.3.tar.gz record"
              exit 1
            fi
            (cd "$sites_dir" && sha256sum --check --strict "$sums_dir/Gaius-site-1.21.11.tar.gz.sha256")
            (cd "$sites_dir" && sha256sum --check --strict "$sums_dir/Gaius-site-26.2.tar.gz.sha256")
            (cd "$sites_dir" && sha256sum --check --strict "$sums_dir/Gaius-site-26.3.tar.gz.sha256")
            for profile in 1.21.11 26.2 26.3; do
              archive="$sites_dir/Gaius-site-${profile}.tar.gz"
              # Only plain relative files: no links, devices, absolute paths, "." or "..".
              if tar -tvzf "$archive" | awk 'substr($0, 1, 1) != "-" { bad = 1 } END { exit bad ? 0 : 1 }'; then
                echo "::error::Gaius-site-${profile}.tar.gz holds an entry that is not a regular file"
                exit 1
              fi
              while IFS= read -r entry; do
                if [[ ! "$entry" =~ ^[A-Za-z0-9_-][A-Za-z0-9._-]*(/[A-Za-z0-9_-][A-Za-z0-9._-]*)*$ ]] || [[ "/$entry/" == *"/../"* ]]; then
                  echo "::error::Gaius-site-${profile}.tar.gz holds an unexpected path"
                  exit 1
                fi
              done < <(tar -tzf "$archive")
              mkdir -p "pages-publish/$profile"
              tar -xzf "$archive" -C "pages-publish/$profile" --no-same-owner --no-same-permissions
              test -s "pages-publish/$profile/index.html"
              test -s "pages-publish/$profile/gaius-sw.js"
              test -s "pages-publish/$profile/gaius-site.json"
              # The single-file URL of earlier releases now opens the site, keeping query and fragment.
              printf '%s\n' \
                '<!doctype html>' \
                '<meta charset="utf-8">' \
                "<title>Gaius ${profile}</title>" \
                "<script>location.replace(\"${profile}/\" + location.search + location.hash);</script>" \
                "<meta http-equiv=\"refresh\" content=\"0; url=${profile}/\">" \
                > "pages-publish/Gaius-${profile}.html"
              site_sha256="$(cut -d ' ' -f 1 "$sums_dir/Gaius-site-${profile}.tar.gz.sha256")"
              echo "sha256_site_${profile//./_}=${site_sha256}" >> "$GITHUB_OUTPUT"
              summary+=("- Gaius-site-${profile}.tar.gz sha256: \`${site_sha256}\` (matches the release SHA256SUMS), served at \`${profile}/\`")
            done
            # A tab opened before this deploy still loads lazy assets (singleplayer server, kernel
            # worker and wasm) by its own hashed names, so the hashed files of the previously
            # deployed site release stay published next to the new ones. The previous tag comes
            # from the live gaius-pages.json and is only a hint: that release's archives must
            # verify against its own SHA256SUMS, only content-hashed names are merged (never
            # index.html, gaius-sw.js or gaius-site.json), the big boot-time packs are left out,
            # and a merge that would cross the size limit is undone. Any failure skips the merge.
            previous_tag=""
            if [ -n "${PAGES_BASE_URL:-}" ]; then
              previous_tag="$(curl -fsSL --max-time 20 "${PAGES_BASE_URL%/}/gaius-pages.json" 2>/dev/null | jq -r 'select(.layout == "site") | .tag // empty' 2>/dev/null || true)"
            fi
            previous_dir="${RUNNER_TEMP}/pages-previous-site"
            merged_list="${RUNNER_TEMP}/pages-previous-merged.txt"
            rm -rf "$previous_dir" "$merged_list"
            : > "$merged_list"
            merge_previous_generation() {
              local profile previous_archive entry target
              mkdir -p "$previous_dir"
              gh release download "$previous_tag" \
                --repo "${GITHUB_REPOSITORY}" \
                --pattern 'SHA256SUMS' \
                --pattern 'Gaius-site-1.21.11.tar.gz' \
                --pattern 'Gaius-site-26.2.tar.gz' \
                --pattern 'Gaius-site-26.3.tar.gz' \
                --dir "$previous_dir" \
                --clobber || return 1
              for profile in 1.21.11 26.2 26.3; do
                previous_archive="Gaius-site-${profile}.tar.gz"
                grep -E "^[0-9a-f]{64}  ${previous_archive//./[.]}\$" "$previous_dir/SHA256SUMS" > "$previous_dir/${previous_archive}.sha256" || return 1
                [ "$(wc -l < "$previous_dir/${previous_archive}.sha256")" -eq 1 ] || return 1
                (cd "$previous_dir" && sha256sum --check --strict --quiet "${previous_archive}.sha256") || return 1
                if tar -tvzf "$previous_dir/$previous_archive" | awk 'substr($0, 1, 1) != "-" { bad = 1 } END { exit bad ? 0 : 1 }'; then
                  return 1
                fi
                mkdir -p "$previous_dir/$profile"
                while IFS= read -r entry; do
                  if [[ ! "$entry" =~ ^[A-Za-z0-9_-][A-Za-z0-9._-]*(/[A-Za-z0-9_-][A-Za-z0-9._-]*)*$ ]] || [[ "/$entry/" == *"/../"* ]]; then
                    return 1
                  fi
                done < <(tar -tzf "$previous_dir/$previous_archive")
                tar -xzf "$previous_dir/$previous_archive" -C "$previous_dir/$profile" --no-same-owner --no-same-permissions || return 1
                while IFS= read -r entry; do
                  [[ "$entry" =~ \.[0-9a-f]{16}\.[A-Za-z0-9]+$ ]] || continue
                  case "${entry##*/}" in
                    classes.*|vanilla-assets.pack.*|vanilla-sounds.pack.*) continue ;;
                  esac
                  target="pages-publish/$profile/$entry"
                  [ -e "$target" ] && continue
                  mkdir -p "$(dirname "$target")"
                  cp "$previous_dir/$profile/$entry" "$target" || return 1
                  printf '%s\n' "$target" >> "$merged_list"
                done < <(tar -tzf "$previous_dir/$previous_archive")
              done
              return 0
            }
            undo_previous_generation() {
              local target
              while IFS= read -r target; do
                rm -f "$target"
              done < "$merged_list"
              : > "$merged_list"
            }
            if [[ "$previous_tag" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]*$ ]] && [ "$previous_tag" != "$PAGES_RELEASE_TAG" ]; then
              if merge_previous_generation; then
                summary+=("- Kept $(wc -l < "$merged_list") hashed files of the previously deployed release \`${previous_tag}\` (verified against its SHA256SUMS)")
              else
                undo_previous_generation
                echo "::warning::The previously deployed release has no verifiable site archives; its hashed files are not kept"
              fi
              if [ "$(du -sb pages-publish | cut -f 1)" -ge 1000000000 ]; then
                undo_previous_generation
                echo "::warning::Keeping the previous site generation would cross the 1 GB Pages limit; it is not kept"
              fi
            fi
            rm -rf "$previous_dir"
            # GitHub Pages sites must stay below 1 GB.
            published_bytes="$(du -sb pages-publish | cut -f 1)"
            if [ "$published_bytes" -ge 1000000000 ]; then
              echo "::error::The Pages site would be ${published_bytes} bytes; GitHub Pages allows at most 1 GB"
              exit 1
            fi
          else
            layout=single-file
            gh release download "$PAGES_RELEASE_TAG" \
              --repo "${GITHUB_REPOSITORY}" \
              --pattern 'Gaius-1.21.11.html' \
              --pattern 'Gaius-26.2.html' \
              --pattern 'Gaius-26.3.html' \
              --dir pages-publish \
              --clobber
            # The published site is exactly these three files.
            test "$(find pages-publish -mindepth 1 | wc -l)" -eq 3
            test -f pages-publish/Gaius-1.21.11.html
            test -s pages-publish/Gaius-1.21.11.html
            test -f pages-publish/Gaius-26.2.html
            test -s pages-publish/Gaius-26.2.html
            test -f pages-publish/Gaius-26.3.html
            test -s pages-publish/Gaius-26.3.html
            # Exactly one record per client, and every client must verify before upload.
            grep -E '^[0-9a-f]{64}  Gaius-1\.21\.11\.html$' "$sums_dir/SHA256SUMS" > "$sums_dir/Gaius-1.21.11.html.sha256" || true
            if [ "$(wc -l < "$sums_dir/Gaius-1.21.11.html.sha256")" -ne 1 ]; then
              echo "::error::SHA256SUMS of ${PAGES_RELEASE_TAG} must hold exactly one Gaius-1.21.11.html record"
              exit 1
            fi
            grep -E '^[0-9a-f]{64}  Gaius-26\.2\.html$' "$sums_dir/SHA256SUMS" > "$sums_dir/Gaius-26.2.html.sha256" || true
            if [ "$(wc -l < "$sums_dir/Gaius-26.2.html.sha256")" -ne 1 ]; then
              echo "::error::SHA256SUMS of ${PAGES_RELEASE_TAG} must hold exactly one Gaius-26.2.html record"
              exit 1
            fi
            grep -E '^[0-9a-f]{64}  Gaius-26\.3\.html$' "$sums_dir/SHA256SUMS" > "$sums_dir/Gaius-26.3.html.sha256" || true
            if [ "$(wc -l < "$sums_dir/Gaius-26.3.html.sha256")" -ne 1 ]; then
              echo "::error::SHA256SUMS of ${PAGES_RELEASE_TAG} must hold exactly one Gaius-26.3.html record"
              exit 1
            fi
            (cd pages-publish && sha256sum --check --strict "$sums_dir/Gaius-1.21.11.html.sha256")
            (cd pages-publish && sha256sum --check --strict "$sums_dir/Gaius-26.2.html.sha256")
            (cd pages-publish && sha256sum --check --strict "$sums_dir/Gaius-26.3.html.sha256")
            for profile in 1.21.11 26.2 26.3; do
              page_sha256="$(cut -d ' ' -f 1 "$sums_dir/Gaius-${profile}.html.sha256")"
              echo "sha256_${profile//./_}=${page_sha256}" >> "$GITHUB_OUTPUT"
              summary+=("- Gaius-${profile}.html sha256: \`${page_sha256}\` (matches the release SHA256SUMS)")
            done
            # After a site release, browsers still hold that site's Service Worker and caches for
            # <profile>/. Publish a worker there that deletes the gaius-* caches and unregisters
            # itself (the browser fetches it on its next update check), and an index.html that
            # sends <profile>/ to the single-file client.
            for profile in 1.21.11 26.2 26.3; do
              mkdir -p "pages-publish/$profile"
              printf '%s\n' \
                '// Gaius retired this multi-file site: remove its caches and this worker.' \
                'self.addEventListener("install", function () { self.skipWaiting(); });' \
                'self.addEventListener("activate", function (event) {' \
                '  event.waitUntil(caches.keys().then(function (names) {' \
                '    return Promise.all(names.filter(function (name) { return name.indexOf("gaius-") === 0; })' \
                '      .map(function (name) { return caches.delete(name); }));' \
                '  }).then(function () { return self.registration.unregister(); }));' \
                '});' \
                > "pages-publish/$profile/gaius-sw.js"
              printf '%s\n' \
                '<!doctype html>' \
                '<meta charset="utf-8">' \
                "<title>Gaius ${profile}</title>" \
                "<script>location.replace(\"../Gaius-${profile}.html\" + location.search + location.hash);</script>" \
                "<meta http-equiv=\"refresh\" content=\"0; url=../Gaius-${profile}.html\">" \
                > "pages-publish/$profile/index.html"
            done
          fi
          # The next deploy reads this to keep the hashed files of the generation it replaces.
          printf '{"schema":1,"tag":"%s","layout":"%s"}\n' "$PAGES_RELEASE_TAG" "$layout" > pages-publish/gaius-pages.json
          echo "layout=${layout}" >> "$GITHUB_OUTPUT"
          # Only now, after every SHA256SUMS gate passed, announce the deployment.
          {
            echo "Deploying Gaius-1.21.11.html, Gaius-26.2.html and Gaius-26.3.html from ${PAGES_RELEASE_TAG} (${PAGES_RELEASE_SOURCE})"
            echo "- Release tag: \`${PAGES_RELEASE_TAG}\`"
            echo "- Layout: ${layout}"
            printf '%s\n' "${summary[@]}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-publish
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
