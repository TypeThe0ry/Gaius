name: Repository guard

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lfs-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository pointers
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - name: Install Git LFS hooks
        run: git lfs install --local

      - name: Verify repository and LFS boundaries
        run: ./tools/check-lfs.sh

      - name: Validate public RelayNode registry
        run: node tools/check-relay-registry.mjs

      - name: Reject public IPv4 literals in tracked files
        run: node tools/check-public-network-secrets.mjs

  release-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/bridge/package-lock.json

      - name: Validate release metadata and screenshots
        run: node tools/check-release-metadata.mjs

      - name: Validate final release gate scripts and fixtures
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node --check tools/browser-multiplayer-terrain-cdp.mjs
          node tools/browser-multiplayer-terrain-cdp.mjs --static-self-test
          node --check tools/check-multiplayer-terrain-evidence.mjs
          node tools/check-multiplayer-terrain-evidence.mjs --static-self-test
          node --check tools/check-singleplayer-terrain-evidence.mjs
          node tools/check-singleplayer-terrain-evidence.mjs --static-self-test
          node --check port/scripts/browser-file-entry-acceptance.mjs
          node port/scripts/browser-file-entry-acceptance.mjs --static-self-test
          node --check tools/verify-github-pages-cdp.mjs
          node tools/verify-github-pages-cdp.mjs --static-self-test
          ./tools/fresh-download-verify-v0.1.0.ps1 -SelfTest
          $files = @(
            'tools/prepare-final-release-v0.1.0.ps1',
            'tools/publish-final-release-v0.1.0.ps1',
            'tools/fresh-download-verify-v0.1.0.ps1',
            'verify-1.21.11-release-node.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file), [ref]$tokens, [ref]$errors)
            if ($errors.Count -ne 0) {
              throw "$file PowerShell parse errors: $($errors -join '; ')"
            }
          }
          $publish = Get-Content tools/publish-final-release-v0.1.0.ps1 -Raw
          foreach ($required in @(
            '--clobber',
            'fresh-download-verify-v0.1.0.ps1',
            'gh workflow run pages.yml',
            'gh run list',
            'gh run view',
            'tools/verify-github-pages-cdp.mjs',
            'workflow_dispatch',
            'release_token',
            'displayTitle',
            'createdAt',
            'PagesVerifierTimeoutSeconds',
            'Start-Process',
            'GAIUS_CDP_PROFILE_ROOT',
            'taskkill',
            'Assert-TagUnchanged',
            'Assert-ReleaseSourceState',
            'Assert-NoOpenPullRequestsOrIssues',
            'gh pr list',
            'gh issue list',
            'gh release delete-asset',
            'git ls-remote origin'
          )) {
            if (-not $publish.Contains($required)) { throw "publish gate missing: $required" }
          }
          $prepare = Get-Content tools/prepare-final-release-v0.1.0.ps1 -Raw
          foreach ($required in @(
            'Multiplayer12111Evidence',
            'Multiplayer262Evidence',
            '''1.21.11.multiplayer''',
            '''26.2.multiplayer''',
            'Multiplayer12111Target',
            'Multiplayer262Target',
            'PagesDefaultTarget',
            'Pages12111DefaultTarget',
            'Pages262DefaultTarget',
            'Assert-ReleaseSourceState',
            '--untracked-files=no',
            'schemaVersion = 4',
            '$env:PROFILE'
          )) {
            if (-not $prepare.Contains($required)) { throw "dual-profile prepare gate missing: $required" }
          }
          foreach ($required in @(
            'Multiplayer12111EvidencePath',
            'Multiplayer262EvidencePath',
            '''1.21.11.multiplayer''',
            '''26.2.multiplayer''',
            'GAIUS_TARGET_12111',
            'GAIUS_TARGET_262',
            'GAIUS_PAGES_DEFAULT_TARGET',
            'GAIUS_PAGE_DEFAULT_TARGET_12111',
            'GAIUS_PAGE_DEFAULT_TARGET_262',
            'schemaVersion -ne 4',
            '$env:PROFILE'
          )) {
            if (-not $publish.Contains($required)) { throw "dual-profile publish gate missing: $required" }
          }
          foreach ($required in @(
            'event -eq ''workflow_dispatch''',
            'headSha -eq $head',
            'displayTitle -eq $expectedPagesTitle',
            'createdAt -ge $pagesDispatchNotBefore'
          )) {
            if (-not $publish.Contains($required)) { throw "Pages run identity gate missing: $required" }
          }
          foreach ($forbidden in @(
            'release-v0.1.0-final-20260913-clobber.ps1',
            'release-v0.1.0-fresh-download-verify.ps1',
            'Gaius-migration-2026-08-14',
            '_tmp'
          )) {
            if ($publish.Contains($forbidden)) { throw "publish gate has external/ignored dependency: $forbidden" }
          }
          foreach ($forbidden in @('git tag', 'git push', 'release create', '--tag ')) {
            if ($publish.Contains($forbidden)) { throw "publish gate may mutate the tag/ref: $forbidden" }
          }
          $single = Get-Content port/scripts/browser-file-entry-acceptance.mjs -Raw
          foreach ($required in @('singleRuntime', 'cdpClosed', 'chromeExited', 'profileRemoved', 'artifactUnchanged', 'terrainVisualPass', 'loadedChunkCount', 'chunkEventCount')) {
            if (-not $single.Contains($required)) { throw "single acceptance gate missing: $required" }
          }
          $singleValidator = Get-Content tools/check-singleplayer-terrain-evidence.mjs -Raw
          foreach ($required in @('terrain-visual-recomputed', 'terrain-screenshot-identity', 'artifact-identity')) {
            if (-not $singleValidator.Contains($required)) { throw "single evidence validator missing: $required" }
          }
          $pages = Get-Content tools/verify-github-pages-cdp.mjs -Raw
          foreach ($required in @('cdpClosed', 'chromeExited', 'profileRemoved', 'pagesFinalGate')) {
            if (-not $pages.Contains($required)) { throw "Pages CDP gate missing: $required" }
          }
          foreach ($required in @(
            'GAIUS_TARGET_12111',
            'GAIUS_TARGET_262',
            'GAIUS_PAGES_DEFAULT_TARGET',
            'GAIUS_PAGE_DEFAULT_TARGET_12111',
            'GAIUS_PAGE_DEFAULT_TARGET_262',
            'expectedTargets',
            'expectedPageTargets'
          )) {
            if (-not $pages.Contains($required)) { throw "Pages per-profile target gate missing: $required" }
          }
          foreach ($required in @('CDP_COMMAND_TIMEOUT_MS', 'GAIUS_CDP_PROFILE_ROOT', 'rejectPending', 'timed out after')) {
            if (-not $pages.Contains($required)) { throw "Pages CDP timeout gate missing: $required" }
          }
          foreach ($required in @(
            'resource-packs/008381d7a89976709aa86bb71dee06dc50bb3961.zip',
            '61_102_872',
            '008381d7a89976709aa86bb71dee06dc50bb3961',
            'ee96a1fe577a90f1c2a3f686cdec060a3cbf0f127ae8e0585cb79dd93e69e172',
            'Network.getResponseBody',
            'declaredContentLength',
            'loadingFinished',
            'resource-pack-exact-get-content-length-loading-finished-body-hashes'
          )) {
            if (-not $pages.Contains($required)) { throw "Pages fixed resource-pack gate missing: $required" }
          }
          $pagesWorkflow = Get-Content .github/workflows/pages.yml -Raw
          foreach ($required in @('run-name:', 'release_token:', 'required: true')) {
            if (-not $pagesWorkflow.Contains($required)) { throw "Pages workflow release token gate missing: $required" }
          }

      - name: Validate launcher version and artifact identity
        run: |
          set -euo pipefail
          python3 port/scripts/test-index-template.py
          python3 port/scripts/test-postprocess-index-shell.py
          python3 port/scripts/test-portable-artifact-identity.py
          python3 port/scripts/test-vanilla-resource-order.py

  bridge-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/bridge/package-lock.json

      - name: Install RelayNode dependencies
        run: npm ci --prefix apps/bridge

      - name: Run RelayNode protocol and registry smoke tests for both profiles
        run: |
          set -euo pipefail
          for profile in 1.21.11 26.2; do
            GAIUS_SMOKE_MINECRAFT_VERSION="$profile" npm run smoke --prefix apps/bridge
          done
          npm run smoke:profiles --prefix apps/bridge

  worker-telemetry-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Validate TeaVM Formatter percent regression
        run: |
          set -euo pipefail
          # The Maven wrapper loads the default 26.2 profile and therefore
          # enforces JDK 25. This fixture only needs TeaVM jars; invoke Maven
          # with the runner JDK directly and leave profile selection untouched.
          mvn --batch-mode --no-transfer-progress \
            org.apache.maven.plugins:maven-dependency-plugin:3.8.1:get \
            -Dartifact=org.teavm:teavm-tooling:0.15.0
          mvn --batch-mode --no-transfer-progress \
            org.apache.maven.plugins:maven-dependency-plugin:3.8.1:get \
            -Dartifact=org.teavm:teavm-classlib:0.15.0
          for artifact in asm asm-tree asm-analysis; do
            mvn --batch-mode --no-transfer-progress \
              org.apache.maven.plugins:maven-dependency-plugin:3.8.1:get \
              "-Dartifact=org.ow2.asm:${artifact}:9.8" -Dtransitive=false
          done
          node port/scripts/formatter-percent-smoke.mjs

      - name: Validate TeaVM JSBody syntax before full compilation
        run: |
          set -euo pipefail
          export GAIUS_VERSION_PROFILE_PATH=versions/1.21.11.json
          for artifact in teavm-core teavm-relocated-libs-rhino; do
            ./port/mvnw --batch-mode --no-transfer-progress \
              org.apache.maven.plugins:maven-dependency-plugin:3.8.1:get \
              "-Dartifact=org.teavm:${artifact}:0.15.0" -Dtransitive=false
          done
          node port/scripts/teavm-jsbody-parser-smoke.mjs \
            port/src/main/java/dev/gaius/browser/BrowserGenerationSpawnTelemetry.java \
            port/src/main/java/dev/gaius/browser/BrowserWorldgenScheduler.java \
            port/overrides/libraries/lwjgl-glfw/src/main/java/org/lwjgl/glfw/BrowserGlfw.java

      - name: Validate bounded Worker stall telemetry
        run: |
          set -euo pipefail
          node --check port/scripts/singleplayer-worker-runtime-smoke.mjs
          node --check port/scripts/singleplayer-worker-slow-sample-smoke.mjs
          node --check port/scripts/singleplayer-worker-runtime-output.mjs
          node --check port/scripts/singleplayer-worker-runtime-output-smoke.mjs
          node port/scripts/singleplayer-worker-runtime-output-smoke.mjs
          GAIUS_SMOKE_SELF_TEST=1 \
            node port/scripts/singleplayer-worker-runtime-smoke.mjs
          node port/scripts/singleplayer-worker-slow-sample-smoke.mjs
          node port/scripts/chunk-pipeline-telemetry-smoke.mjs
          node port/scripts/chunk-layer-barrier-smoke.mjs
          node port/scripts/browser-cooperative-executor-smoke.mjs
          node port/scripts/download-queue-cooperative-patch-smoke.mjs
          node port/scripts/browser-compression-decoder-production-smoke.mjs
          node port/scripts/gson-type-token-external-overlay-smoke.mjs
          node port/scripts/worldgen-scheduler-smoke.mjs

      - name: Validate singleplayer storage and session lifecycle
        run: node tools/check-singleplayer-lifecycle.mjs

  patcher-bytecode-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK 26 for class-file version 69 and release 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "26"

      - name: Fetch and remap both Minecraft patcher inputs
        run: |
          set -euo pipefail
          export GAIUS_JAVA_HOME="$JAVA_HOME"
          for tool in curl jq unzip zip sha1sum shasum; do
            command -v "$tool" >/dev/null
          done
          for profile in 1.21.11 26.2; do
            export GAIUS_VERSION_PROFILE_PATH="versions/${profile}.json"
            ./port/scripts/fetch-version.sh
            ./port/scripts/remap-client.sh
            jar_path="port/work/${profile}/client-named.jar"
            test -s "$jar_path"
            unzip -tq "$jar_path"
            case "$profile" in
              1.21.11) expected_major=65 ;;
              26.2) expected_major=69 ;;
            esac
            actual_major="$("$JAVA_HOME/bin/javap" -verbose \
              -classpath "$jar_path" \
              net.minecraft.server.level.ChunkGenerationTask \
              | awk '/major version/{print $3; exit}')"
            test "$actual_major" = "$expected_major"
          done

      - name: Bootstrap ASM and TeaVM callback verifier dependencies
        run: |
          set -euo pipefail
          export GAIUS_JAVA_HOME="$JAVA_HOME"
          for artifact in asm asm-tree asm-analysis; do
            ./port/mvnw --batch-mode --no-transfer-progress \
              org.apache.maven.plugins:maven-dependency-plugin:3.8.1:get \
              "-Dartifact=org.ow2.asm:${artifact}:9.8" \
              -Dtransitive=false
          done
          ./port/mvnw --batch-mode --no-transfer-progress \
            org.apache.maven.plugins:maven-dependency-plugin:3.8.1:get \
            -Dartifact=org.teavm:teavm-platform:0.15.0 \
            -Dtransitive=false

      - name: Run profile-aware ASM CFG patcher gates
        run: |
          set -euo pipefail
          export GAIUS_JAVA_HOME="$JAVA_HOME"
          "$JAVA_HOME/bin/java" --version
          "$JAVA_HOME/bin/javac" --release 21 -version
          major_version="$("$JAVA_HOME/bin/javap" -verbose \
            -classpath port/work/26.2/client-named.jar \
            net.minecraft.server.level.ChunkGenerationTask \
            | awk '/major version/{print $3; exit}')"
          test "$major_version" = 69
          node --check port/scripts/minecraft-12111-patcher-smoke.mjs
          node --check port/scripts/minecraft-262-p1-patcher-smoke.mjs
          node port/scripts/chunk-layer-barrier-smoke.mjs
          GAIUS_VERSION_PROFILE_PATH=versions/1.21.11.json \
            node port/scripts/minecraft-12111-patcher-smoke.mjs
          GAIUS_VERSION_PROFILE_PATH=versions/26.2.json \
            node port/scripts/minecraft-262-p1-patcher-smoke.mjs

      - name: Check repository diff formatting
        run: git diff --check

  paper-plugin-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run Paper plugin unit tests
        env:
          # The optional plugin targets the retained 1.21.11 profile. Keep the
          # JDK-21 guard job from inheriting the active 26.2/JDK-25 profile.
          GAIUS_VERSION_PROFILE_PATH: versions/1.21.11.json
        run: ./port/mvnw -B -ntp -f apps/server-plugin/pom.xml test
