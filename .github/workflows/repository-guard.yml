name: Repository guard

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lfs-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository pointers
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - name: Install Git LFS hooks
        run: git lfs install --local

      - name: Verify repository and LFS boundaries
        run: ./tools/check-lfs.sh

      - name: Validate public RelayNode registry
        run: node tools/check-relay-registry.mjs

  release-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/bridge/package-lock.json

      - name: Validate release metadata and screenshots
        run: node tools/check-release-metadata.mjs

  bridge-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/bridge/package-lock.json

      - name: Install RelayNode dependencies
        run: npm ci --prefix apps/bridge

      - name: Run RelayNode protocol and registry smoke tests for both profiles
        run: |
          set -euo pipefail
          for profile in 1.21.11 26.2; do
            GAIUS_SMOKE_MINECRAFT_VERSION="$profile" npm run smoke --prefix apps/bridge
          done
          npm run smoke:profiles --prefix apps/bridge

  worker-telemetry-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Validate bounded Worker stall telemetry
        run: |
          set -euo pipefail
          node --check port/scripts/singleplayer-worker-runtime-smoke.mjs
          GAIUS_SMOKE_SELF_TEST=1 \
            node port/scripts/singleplayer-worker-runtime-smoke.mjs
          node port/scripts/worldgen-scheduler-smoke.mjs

  paper-plugin-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run Paper plugin unit tests
        env:
          # The optional plugin targets the retained 1.21.11 profile. Keep the
          # JDK-21 guard job from inheriting the active 26.2/JDK-25 profile.
          GAIUS_VERSION_PROFILE_PATH: versions/1.21.11.json
        run: ./port/mvnw -B -ntp -f apps/server-plugin/pom.xml test
