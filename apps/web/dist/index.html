<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Gaius Minecraft Java Edition 1.21.11 browser singleplayer prototype"
    />
    <title>Gaius · 1.21.11 单人模式</title>
    <script type="module" crossorigin src="/assets/index-CbV8UywP.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-C2GCt24r.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="masthead">
        <div>
          <p class="eyebrow">GAIUS / SINGLEPLAYER</p>
          <h1>浏览器里的<br />内置服务器</h1>
        </div>
        <p class="lede">
          真实的客户端／服务器边界，1.21.11 世界高度，Worker 权威 tick，
          区块调色板与持久化。当前画面是验证玩法语义的调试渲染器。
        </p>
      </header>

      <section class="world-layout">
        <aside class="panel world-controls">
          <div class="panel-heading">
            <div>
              <p class="eyebrow">LOCAL SERVER</p>
              <h2>单人世界</h2>
            </div>
            <span class="protocol">1.21.11</span>
          </div>

          <label>
            世界名称
            <input id="world-name" value="Gaius 世界" maxlength="64" />
          </label>
          <label>
            种子
            <input id="world-seed" value="20260619" maxlength="128" />
          </label>

          <div class="button-row">
            <button id="create-world" type="button">创建／重置</button>
            <button id="load-world" type="button" class="secondary">加载存档</button>
          </div>

          <p id="world-state" class="state" data-kind="idle">正在启动 Worker…</p>

          <dl class="world-stats">
            <div><dt>世界</dt><dd id="world-name-display">—</dd></div>
            <div><dt>服务器 Tick</dt><dd id="tick">—</dd></div>
            <div><dt>玩家坐标</dt><dd id="position">—</dd></div>
            <div><dt>确认输入序号</dt><dd id="ack">—</dd></div>
          </dl>

          <div class="instructions">
            <p><kbd>WASD</kbd> 移动</p>
            <p><kbd>左键</kbd> 破坏顶部方块</p>
            <p><kbd>右键</kbd> 放置泥土</p>
          </div>
        </aside>

        <section class="world-viewport" aria-label="单人世界调试视图">
          <canvas id="world-canvas" width="640" height="640"></canvas>
          <span class="debug-badge">TOP-DOWN DEBUG RENDERER</span>
        </section>
      </section>

      <details class="multiplayer-tools">
        <summary>多人协议状态探针</summary>
        <section class="panel">
          <form id="status-form">
            <label>
              服务器地址
              <input id="host" value="localhost" required />
            </label>
            <label>
              端口
              <input id="port" type="number" min="1" max="65535" value="25565" required />
            </label>
            <label class="wide">
              桥地址
              <input id="bridge" type="url" value="ws://127.0.0.1:8080/tunnel" required />
            </label>
            <button type="submit">查询协议 774</button>
          </form>
          <p id="status-state" class="state" data-kind="idle">等待查询</p>
          <article id="result" class="result" hidden>
            <p id="motd" class="motd"></p>
            <dl>
              <div><dt>服务端版本</dt><dd id="version">—</dd></div>
              <div><dt>协议</dt><dd id="server-protocol">—</dd></div>
              <div><dt>在线人数</dt><dd id="players">—</dd></div>
              <div><dt>往返延迟</dt><dd id="latency">—</dd></div>
            </dl>
          </article>
        </section>
      </details>
    </main>

  </body>
</html>
